<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>截图取景包装页（⛔ 不属于应用代码）</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #f8fafc;
      }
      iframe {
        border: 0;
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!--
      比赛截图取景用的**本地包装页**（提交材料工具，⛔ 不是应用的一部分，⛔ 不参与任何业务逻辑）。

      用途：让截屏统一、专业——把演示页面放进同源 iframe，按区块 id 精确滚动到脚本指定位置再截屏。
      ⛔ 它不修改应用、不注入业务逻辑、不读取任何接口数据，只做滚动。

      用法（需先把本文件复制到前端构建产物目录，使它与应用同源）：
        1) cd frontend && npm run build
        2) 复制本文件到 frontend/dist/shot-harness.html
        3) 后端：cd backend && python -m uvicorn app.main:app --port 8000
        4) 前端预览：cd frontend && npm run preview -- --port 4173
        5) 截屏（示例）：
           msedge.exe --headless=new --disable-gpu --hide-scrollbars \
             --window-size=1600,1200 --virtual-time-budget=15000 \
             --screenshot=03_offerings_preferences.png \
             "http://127.0.0.1:4173/shot-harness.html?sel=%23section-offerings&dy=-40"

      ⛔ frontend/dist/ 不入库；本文件只是取景工具，与「演示版本」无关。
    -->
    <iframe id="app" src="/" title="学航·转衔 演示页面"></iframe>
    <script>
      const params = new URLSearchParams(location.search)
      const target = params.get('sel')
      const dy = parseInt(params.get('dy') || '0', 10)
      const frame = document.getElementById('app')

      frame.addEventListener('load', () => {
        const win = frame.contentWindow
        const doc = frame.contentDocument
        let tries = 0
        const tick = () => {
          tries += 1
          const element = target ? doc.querySelector(target) : null
          if (element) {
            const top = element.getBoundingClientRect().top + win.scrollY
            win.scrollTo(0, Math.max(0, top + (Number.isFinite(dy) ? dy : 0)))
            document.title = 'READY'
            return
          }
          if (tries < 80) {
            setTimeout(tick, 100)
            return
          }
          document.title = 'NOTFOUND'
        }
        tick()
      })
    </script>
  </body>
</html>
